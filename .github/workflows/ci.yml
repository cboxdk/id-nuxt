name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # npm 10 (bundled with Node 20/22) crashes resolving this module's dev tree
      # ("Cannot read properties of null (reading 'edgesOut')"); npm 11 resolves it, and
      # release.yml already publishes with npm 11. Consumers' installs are unaffected —
      # it is nuxt + module-builder in devDependencies that trip it.
      - run: npm install -g npm@11
      - run: npm install
      - run: npm run build
